name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  github:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: tools/config/release-please.json
          manifest-file: tools/config/release-manifest.json

  npm:
    needs: github
    if: needs.github.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@uqrealitylabs/eyslie
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.github.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: |
          set -euo pipefail
          npm ci --ignore-scripts --allow-git=none
          npm audit signatures
          npm run security:audit -- --ignore-scripts
          npm run test:ci:base
          mkdir -p "${RUNNER_TEMP}/eyslie"
          filename=$(npm pack --silent --ignore-scripts --pack-destination "${RUNNER_TEMP}/eyslie")
          tarball="${RUNNER_TEMP}/eyslie/${filename}"
          npm publish "$tarball" --ignore-scripts --provenance --access public
