name: Rady dependency solver

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  rady:
    permissions:
      contents: write
      pull-requests: write
    uses: keys-i/dependasolver/.github/workflows/solve.yml@c3f8cbfd4dc9f033c07373915b3dcdfc016a5137
    with:
      app-client-id: ${{ vars.DEPENDASOLVER_APP_CLIENT_ID }}
      required-checks: '["test", "audit", "dependency-review"]'
    secrets:
      app-private-key: ${{ secrets.DEPENDASOLVER_APP_PRIVATE_KEY }}
